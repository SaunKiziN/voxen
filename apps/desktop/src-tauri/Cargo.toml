[package]
name = "sharkord-desktop"
version = "0.0.23"
description = "Sharkord desktop smoke test"
authors = ["Sharkord contributors"]
edition = "2021"
rust-version = "1.77"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
